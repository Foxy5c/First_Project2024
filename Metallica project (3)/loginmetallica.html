<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="loginstyle.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container" id="container">
        <div class="form-container sign-up-container">
            <form action="theunforgiventrilogy.html" method="post">
                <h1>Create Account</h1>
                <div class="social-container">
                    <a href="https://www.metallica.com/" target="_blank">
                        <img src="metallica-logo.png" alt="Metallica" class="metallica-logo">
                    </a>  
                    <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a> 
                    <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                </div>
                <span>or use your email for registration</span>
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required />
                <label for="password">Password :</label>
                <input type="password" id="password" name="password" required />
                <button type="submit">Sign Up</button>
            </form>
        </div>
        <div class="form-container sign-in-container">
            <form action="theunforgiventrilogy.html" method="post">
                <h1>Sign in</h1>
                <div class="social-container">
                    <a href="https://www.metallica.com/" target="_blank">
                        <img src="metallica-logo.png" alt="Metallica" class="metallica-logo">
                    </a>  
                    <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a> 
                    <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                </div>
                <span>or use your account</span>
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required /><br>
                <label for="password">Password :</label>
                <input type="password" id="password" name="password" required />
                <a href="">Forgot your password</a>
                <button type="submit">Sign in</button>
            </form>
        </div>
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>
                        To keep connected with us please login with your personal info
                    </p>
                    <button class="ghost" id="signin">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello!</h1>
                    <p>Enter your personal details and start journey with us</p>
                    <button class="ghost" id="signup">Sign Up</button>
                </div>
            </div>
        </div>
    </div>
    <script src="C:\Users\Doris Thadar\HTML\Project1\script.js" defer></script>
</body>
</html>
